name: Validate site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate site
        run: |
          node scripts/validate-site.mjs
          npm test
