<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecosystem Dashboard — David Lifschitz</title>
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/site.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div data-site-nav data-active="dashboard"></div>

  <div class="app-shell">
    <main class="main">
      <div class="main-inner">
        <div class="topbar">
          <div class="topbar-left">
            <div class="utility-chip">Live telemetry</div>
            <div id="cacheBadge" class="utility-chip">Live data</div>
          </div>
          <div class="topbar-right header-profile">
            <div class="profile-avatar">DL</div>
            <div>
              <strong>Dashboard</strong>
              <span id="lastUpdated"></span>
            </div>
          </div>
        </div>

        <div class="page-heading">
          <div>
            <h1 class="page-title">Ecosystem analytics</h1>
            <p class="page-subtitle">Track additions, deletions, commits, and repository activity over time.</p>
          </div>
          <div class="control-strip">
            <div class="control-group"><label>Repo</label><select id="repoSelect" class="select"></select></div>
            <div class="control-group"><label>Compare</label><select id="compareSelect" class="select"></select></div>
            <div class="control-group">
              <label>Window</label>
              <select id="windowSelect" class="select">
                <option value="7">7d</option>
                <option value="14">14d</option>
                <option value="21" selected>21d</option>
                <option value="30">30d</option>
              </select>
            </div>
            <div class="control-group">
              <label>Mode</label>
              <select id="modeSelect" class="select">
                <option value="daily">Daily</option>
                <option value="cumulative">Cumulative</option>
              </select>
            </div>
            <button id="reloadButton" class="button button-primary">Refresh</button>
          </div>
        </div>

        <div class="status-banner">
          <div>
            <strong id="statusBannerTitle">Status</strong>
            <p id="statusBannerCopy"></p>
          </div>
        </div>

        <div id="summaryCards" class="kpi-grid"></div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-header-row">
              <h2 class="panel-title">Activity chart</h2>
            </div>
          </div>
          <div class="chart-shell">
            <div class="chart-frame">
              <svg id="chartSvg"></svg>
              <div id="chartEmpty" class="empty-state">No data</div>
              <div id="chartTooltip" class="chart-tooltip" hidden></div>
            </div>
          </div>
          <p id="chartMeta" class="chart-meta"></p>
          <p id="repoNote"></p>
        </div>

        <div class="panel table-card">
          <div class="table-card-header">
            <h2 class="table-title">Repository summary</h2>
          </div>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Repository</th><th>Visibility</th><th>Branch</th>
                  <th>Additions</th><th>Deletions</th><th>Total</th>
                  <th>Commits</th><th>Status</th><th>Blame</th><th>Trend</th>
                </tr>
              </thead>
              <tbody id="repoTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="scripts/site-nav.js" defer></script>
  <script src="scripts/dashboard.js"></script>
</body>
</html>
